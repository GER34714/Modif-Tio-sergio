<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - TÍO SERGIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0f0a 0%, #000 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #ffcc66;
            font-size: 1.8em;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
        }
        
        .btn-logout {
            background: linear-gradient(90deg, #ff0000, #ff6600);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 10px 10px 0 0;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .tab-btn.active {
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            border-color: transparent;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-section {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .form-section h3 {
            color: #ffcc66;
            margin-bottom: 20px;
            font-size: 1.3em;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffcc66;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffcc66;
            box-shadow: 0 0 15px rgba(255, 204, 102, 0.3);
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .btn-save {
            background: linear-gradient(90deg, #00ff00, #00cc00);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
        }
        
        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .video-list {
            display: grid;
            gap: 15px;
        }
        
        .video-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .video-info {
            display: grid;
            gap: 10px;
        }
        
        .video-preview {
            width: 120px;
            height: 90px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-delete {
            background: linear-gradient(90deg, #ff0000, #cc0000);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #51cf66;
        }
        
        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }
        
        /* Modal para agregar videos */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #1a0f0a 0%, #000 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .modal-header h2 {
            color: #ffcc66;
            font-size: 1.5em;
            text-shadow: 0 0 10px #ff00ff;
        }
        
        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.5);
            transform: rotate(90deg);
        }
        
        .url-input-section {
            margin-bottom: 25px;
        }
        
        .url-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        
        .url-input-wrapper input {
            width: 100%;
            padding: 15px 50px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .url-input-wrapper input:focus {
            outline: none;
            border-color: #ffcc66;
            box-shadow: 0 0 20px rgba(255, 204, 102, 0.3);
        }
        
        .url-input-wrapper .loading-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }
        
        .url-input-wrapper.loading .loading-icon {
            display: block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: translateY(-50%) rotate(0deg); }
            to { transform: translateY(-50%) rotate(360deg); }
        }
        
        .video-preview-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .video-preview-section.active {
            display: block;
        }
        
        .video-preview-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            align-items: start;
        }
        
        .video-thumbnail {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .video-thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .video-details {
            display: grid;
            gap: 15px;
        }
        
        .video-details input,
        .video-details textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }
        
        .video-details textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .video-details input:focus,
        .video-details textarea:focus {
            outline: none;
            border-color: #ffcc66;
            box-shadow: 0 0 15px rgba(255, 204, 102, 0.3);
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        
        .btn-cancel-modal {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 25px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-cancel-modal:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .btn-add-video {
            background: linear-gradient(90deg, #00ff00, #00cc00);
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-add-video:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
        }
        
        .btn-add-video:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            color: #ff6b6b;
            display: none;
        }
        
        .success-message {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            color: #51cf66;
            display: none;
        }
        
        /* Mejoras al botón de agregar video */
        .btn-add-video-main {
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px auto;
        }
        
        .btn-add-video-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 0, 255, 0.4);
        }
        
        .btn-add-video-main::before {
            content: "➕";
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .form-section {
                padding: 20px;
            }
            
            .video-item {
                grid-template-columns: 1fr;
                text-align: center;
            }
            
            .video-preview {
                margin: 0 auto;
            }
            
            .modal-content {
                padding: 20px;
                margin: 20px;
            }
            
            .video-preview-container {
                grid-template-columns: 1fr;
            }
            
            .modal-actions {
                flex-direction: column;
            }
            
            .modal-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎛️ Panel de Administración - TÍO SERGIO</h1>
        <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
    </div>
    
    <div class="container">
        <div class="message" id="message"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('general')">Información General</button>
            <button class="tab-btn" onclick="showTab('videos')">Videos de YouTube</button>
            <button class="tab-btn" onclick="showTab('secciones')">Secciones del Sitio</button>
        </div>
        
        <!-- Tab: Información General -->
        <div id="general" class="tab-content active">
            <div class="form-section">
                <h3>Información Básica del Sitio</h3>
                <form id="generalForm">
                    <div class="form-group">
                        <label for="titulo">Título Principal</label>
                        <input type="text" id="titulo" name="titulo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="horarios">Horarios</label>
                        <input type="text" id="horarios" name="horarios" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" name="telefono" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                    <button type="button" class="btn-cancel" onclick="loadData()">Cancelar</button>
                </form>
            </div>
        </div>
        
        <!-- Tab: Videos de YouTube -->
        <div id="videos" class="tab-content">
            <div class="form-section">
                <h3>Configuración de YouTube</h3>
                <form id="youtubeConfigForm">
                    <div class="form-group">
                        <label for="canal">URL del Canal</label>
                        <input type="url" id="canal" name="canal" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="suscripcion">URL de Suscripción</label>
                        <input type="url" id="suscripcion" name="suscripcion" required>
                    </div>
                    
                    <button type="submit" class="btn-save">Guardar Configuración</button>
                </form>
            </div>
            
            <div class="form-section">
                <h3>Videos Destacados</h3>
                <div class="video-list" id="videoList"></div>
                
                <button class="btn-add-video-main" onclick="openVideoModal()">Agregar Nuevo Video</button>
            </div>
        </div>
        
        <!-- Tab: Secciones del Sitio -->
        <div id="secciones" class="tab-content">
            <div class="form-section">
                <h3>Sección Principal</h3>
                <form id="seccionPrincipalForm">
                    <div class="form-group">
                        <label for="principalTitulo">Título</label>
                        <input type="text" id="principalTitulo" name="principalTitulo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="principalDesc">Descripciones (una por línea)</label>
                        <textarea id="principalDesc" name="principalDesc" rows="5" required></textarea>
                    </div>
                    
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                </form>
            </div>
            
            <div class="form-section">
                <h3>Evento Destacado</h3>
                <form id="eventoDestacadoForm">
                    <div class="form-group">
                        <label for="eventoTitulo">Título</label>
                        <input type="text" id="eventoTitulo" name="eventoTitulo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventoSubtitulo">Subtítulo</label>
                        <input type="text" id="eventoSubtitulo" name="eventoSubtitulo" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventoDesc">Descripciones (una por línea)</label>
                        <textarea id="eventoDesc" name="eventoDesc" rows="3" required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventoHorario">Horario</label>
                        <input type="text" id="eventoHorario" name="eventoHorario" required>
                    </div>
                    
                    <button type="submit" class="btn-save">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Modal para agregar videos -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎬 Agregar Nuevo Video</h2>
                <button class="modal-close" onclick="closeVideoModal()">✕</button>
            </div>
            
            <div class="error-message" id="modalError"></div>
            <div class="success-message" id="modalSuccess"></div>
            
            <div class="url-input-section">
                <label for="videoUrl">📹 URL del Video de YouTube</label>
                <div class="url-input-wrapper" id="urlInputWrapper">
                    <input 
                        type="url" 
                        id="videoUrl" 
                        placeholder="Pega aquí la URL del video de YouTube..."
                        autocomplete="off"
                    >
                    <span class="loading-icon">⏳</span>
                </div>
            </div>
            
            <div class="video-preview-section" id="videoPreviewSection">
                <h3>📋 Vista Previa del Video</h3>
                <div class="video-preview-container">
                    <div class="video-thumbnail">
                        <img id="videoThumbnail" src="" alt="Vista previa del video">
                        <span class="video-duration" id="videoDuration">00:00</span>
                    </div>
                    <div class="video-details">
                        <input 
                            type="text" 
                            id="videoTitle" 
                            placeholder="Título del video..."
                            maxlength="100"
                        >
                        <textarea 
                            id="videoDescription" 
                            placeholder="Descripción del video..."
                            maxlength="200"
                            rows="3"
                        ></textarea>
                    </div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="btn-cancel-modal" onclick="closeVideoModal()">Cancelar</button>
                <button class="btn-add-video" id="btnAddVideo" onclick="addVideoFromModal()" disabled>
                    Agregar Video
                </button>
            </div>
        </div>
    </div>
    
    <script src="security.js"></script>
    <script src="../api/admin.js"></script>
    <script>
        let currentData = {};
        
        // Verificar sesión
        function checkSession() {
            return window.securityManager.checkCurrentSession();
        }
        
        // Cerrar sesión
        function logout() {
            window.securityManager.logout();
            window.location.href = 'login.html';
        }
        
        // Cambiar tabs
        function showTab(tabName) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Desactivar todos los botones
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Mostrar tab seleccionado
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        // Mostrar mensaje
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
        
        // Cargar datos
        async function loadData() {
            try {
                currentData = await window.adminAPI.loadData();
                
                // Cargar información general
                document.getElementById('titulo').value = currentData.sitio.titulo || '';
                document.getElementById('descripcion').value = currentData.sitio.descripcion || '';
                document.getElementById('horarios').value = currentData.sitio.horarios || '';
                document.getElementById('direccion').value = currentData.sitio.direccion || '';
                document.getElementById('telefono').value = currentData.sitio.telefono || '';
                document.getElementById('email').value = currentData.sitio.email || '';
                
                // Cargar configuración YouTube
                document.getElementById('canal').value = currentData.youtube.canal || '';
                document.getElementById('suscripcion').value = currentData.youtube.suscripcion || '';
                
                // Cargar secciones
                document.getElementById('principalTitulo').value = currentData.secciones.principal.titulo || '';
                document.getElementById('principalDesc').value = currentData.secciones.principal.descripcion.join('\n') || '';
                
                document.getElementById('eventoTitulo').value = currentData.secciones.evento_destacado.titulo || '';
                document.getElementById('eventoSubtitulo').value = currentData.secciones.evento_destacado.subtitulo || '';
                document.getElementById('eventoDesc').value = currentData.secciones.evento_destacado.descripcion.join('\n') || '';
                document.getElementById('eventoHorario').value = currentData.secciones.evento_destacado.horario || '';
                
                // Cargar videos
                renderVideos();
                
            } catch (error) {
                showMessage('Error al cargar los datos: ' + error.message, 'error');
            }
        }
        
        // Renderizar videos
        function renderVideos() {
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = '';
            
            currentData.youtube.videos.forEach((video, index) => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <div class="video-info">
                        <img src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg" alt="${video.titulo}" class="video-preview">
                        <div>
                            <strong>${video.titulo}</strong><br>
                            <small>${video.descripcion}</small><br>
                            <small>ID: ${video.id}</small>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="deleteVideo(${index})">Eliminar</button>
                `;
                videoList.appendChild(videoItem);
            });
        }
        
        // Agregar video
        function addVideo() {
            const videoId = prompt('Ingrese el ID del video de YouTube:');
            if (!videoId) return;
            
            const titulo = prompt('Ingrese el título del video:');
            if (!titulo) return;
            
            const descripcion = prompt('Ingrese la descripción del video:');
            if (!descripcion) return;
            
            const newVideo = {
                id: videoId,
                titulo: titulo,
                descripcion: descripcion,
                enlace: `https://www.youtube.com/watch?v=${videoId}`,
                activo: false
            };
            
            currentData.youtube.videos.push(newVideo);
            renderVideos();
            showMessage('Video agregado. No olvide guardar los cambios.', 'success');
        }
        
        // Eliminar video
        function deleteVideo(index) {
            if (confirm('¿Está seguro de eliminar este video?')) {
                currentData.youtube.videos.splice(index, 1);
                renderVideos();
                showMessage('Video eliminado. No olvide guardar los cambios.', 'success');
            }
        }
        
        // Guardar información general
        document.getElementById('generalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            currentData.sitio.titulo = document.getElementById('titulo').value;
            currentData.sitio.descripcion = document.getElementById('descripcion').value;
            currentData.sitio.horarios = document.getElementById('horarios').value;
            currentData.sitio.direccion = document.getElementById('direccion').value;
            currentData.sitio.telefono = document.getElementById('telefono').value;
            currentData.sitio.email = document.getElementById('email').value;
            
            try {
                await window.adminAPI.saveData(currentData);
                showMessage('Información guardada correctamente', 'success');
            } catch (error) {
                showMessage('Error al guardar: ' + error.message, 'error');
            }
        });
        
        // Guardar configuración YouTube
        document.getElementById('youtubeConfigForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            currentData.youtube.canal = document.getElementById('canal').value;
            currentData.youtube.suscripcion = document.getElementById('suscripcion').value;
            
            try {
                await window.adminAPI.saveData(currentData);
                showMessage('Configuración de YouTube guardada', 'success');
            } catch (error) {
                showMessage('Error al guardar: ' + error.message, 'error');
            }
        });
        
        // Guardar secciones
        document.getElementById('seccionPrincipalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            currentData.secciones.principal.titulo = document.getElementById('principalTitulo').value;
            currentData.secciones.principal.descripcion = document.getElementById('principalDesc').value.split('\n').filter(d => d.trim());
            
            try {
                await window.adminAPI.saveData(currentData);
                showMessage('Sección principal guardada', 'success');
            } catch (error) {
                showMessage('Error al guardar: ' + error.message, 'error');
            }
        });
        
        document.getElementById('eventoDestacadoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            currentData.secciones.evento_destacado.titulo = document.getElementById('eventoTitulo').value;
            currentData.secciones.evento_destacado.subtitulo = document.getElementById('eventoSubtitulo').value;
            currentData.secciones.evento_destacado.descripcion = document.getElementById('eventoDesc').value.split('\n').filter(d => d.trim());
            currentData.secciones.evento_destacado.horario = document.getElementById('eventoHorario').value;
            
            try {
                await window.adminAPI.saveData(currentData);
                showMessage('Evento destacado guardado', 'success');
            } catch (error) {
                showMessage('Error al guardar: ' + error.message, 'error');
            }
        });
        
        // Funciones del modal de videos
        let currentVideoData = null;
        
        // Abrir modal
        function openVideoModal() {
            const modal = document.getElementById('videoModal');
            modal.classList.add('active');
            resetModal();
            document.getElementById('videoUrl').focus();
        }
        
        // Cerrar modal
        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            modal.classList.remove('active');
            resetModal();
        }
        
        // Resetear modal
        function resetModal() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoDescription').value = '';
            document.getElementById('videoThumbnail').src = '';
            document.getElementById('videoDuration').textContent = '00:00';
            document.getElementById('videoPreviewSection').classList.remove('active');
            document.getElementById('btnAddVideo').disabled = true;
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('modalSuccess').style.display = 'none';
            document.getElementById('urlInputWrapper').classList.remove('loading');
            currentVideoData = null;
        }
        
        // Manejar cambio en la URL del video
        document.getElementById('videoUrl').addEventListener('input', async function(e) {
            const url = e.target.value.trim();
            
            if (url.length === 0) {
                resetModal();
                return;
            }
            
            // Validar URL de YouTube
            if (!isValidYouTubeURL(url)) {
                return;
            }
            
            // Extraer ID del video
            const videoId = extractYouTubeID(url);
            if (!videoId) {
                return;
            }
            
            // Mostrar loading
            document.getElementById('urlInputWrapper').classList.add('loading');
            
            try {
                // Obtener información del video
                const videoInfo = await getYouTubeVideoInfo(videoId);
                
                // Mostrar preview
                showVideoPreview(videoInfo);
                
            } catch (error) {
                console.error('Error al obtener información del video:', error);
                document.getElementById('modalError').textContent = 'No se pudo obtener información del video. Verifica la URL.';
                document.getElementById('modalError').style.display = 'block';
            } finally {
                document.getElementById('urlInputWrapper').classList.remove('loading');
            }
        });
        
        // Validar URL de YouTube
        function isValidYouTubeURL(url) {
            const patterns = [
                /^https?:\/\/(www\.)?youtube\.com\/watch\?v=[\w-]+/,
                /^https?:\/\/(www\.)?youtu\.be\/[\w-]+/,
                /^https?:\/\/(www\.)?youtube\.com\/embed\/[\w-]+/
            ];
            
            return patterns.some(pattern => pattern.test(url));
        }
        
        // Extraer ID de YouTube
        function extractYouTubeID(url) {
            const patterns = [
                /youtube\.com\/watch\?v=([\w-]+)/,
                /youtu\.be\/([\w-]+)/,
                /youtube\.com\/embed\/([\w-]+)/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    return match[1];
                }
            }
            
            return null;
        }
        
        // Obtener información del video de YouTube
        async function getYouTubeVideoInfo(videoId) {
            // Usar la API de oEmbed para obtener información básica
            const oembedUrl = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
            
            try {
                const response = await fetch(oembedUrl);
                if (!response.ok) {
                    throw new Error('Video no encontrado');
                }
                
                const data = await response.json();
                
                return {
                    id: videoId,
                    title: data.title,
                    description: data.author_name || '',
                    thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                    url: `https://www.youtube.com/watch?v=${videoId}`
                };
                
            } catch (error) {
                // Si falla oEmbed, usar información básica
                return {
                    id: videoId,
                    title: `Video ${videoId}`,
                    description: '',
                    thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                    url: `https://www.youtube.com/watch?v=${videoId}`
                };
            }
        }
        
        // Mostrar vista previa del video
        function showVideoPreview(videoInfo) {
            currentVideoData = videoInfo;
            
            // Actualizar imagen
            document.getElementById('videoThumbnail').src = videoInfo.thumbnail;
            
            // Actualizar título y descripción
            document.getElementById('videoTitle').value = videoInfo.title;
            document.getElementById('videoDescription').value = videoInfo.description;
            
            // Mostrar sección de preview
            document.getElementById('videoPreviewSection').classList.add('active');
            
            // Habilitar botón de agregar
            document.getElementById('btnAddVideo').disabled = false;
            
            // Ocultar mensajes de error
            document.getElementById('modalError').style.display = 'none';
        }
        
        // Agregar video desde el modal
        async function addVideoFromModal() {
            if (!currentVideoData) {
                document.getElementById('modalError').textContent = 'Primero ingresa una URL válida de YouTube.';
                document.getElementById('modalError').style.display = 'block';
                return;
            }
            
            // Obtener datos del formulario
            const title = document.getElementById('videoTitle').value.trim();
            const description = document.getElementById('videoDescription').value.trim();
            
            if (!title) {
                document.getElementById('modalError').textContent = 'El título es obligatorio.';
                document.getElementById('modalError').style.display = 'block';
                return;
            }
            
            // Crear objeto del video
            const newVideo = {
                id: currentVideoData.id,
                titulo: title,
                descripcion: description || 'Video destacado de TÍO SERGIO',
                enlace: currentVideoData.url,
                activo: false
            };
            
            try {
                // Agregar a los datos actuales
                currentData.youtube.videos.push(newVideo);
                
                // Guardar datos
                await window.adminAPI.saveData(currentData);
                
                // Actualizar vista
                renderVideos();
                
                // Mostrar éxito
                document.getElementById('modalSuccess').textContent = '✅ Video agregado correctamente';
                document.getElementById('modalSuccess').style.display = 'block';
                
                // Cerrar modal después de 2 segundos
                setTimeout(() => {
                    closeVideoModal();
                }, 2000);
                
            } catch (error) {
                document.getElementById('modalError').textContent = 'Error al agregar el video: ' + error.message;
                document.getElementById('modalError').style.display = 'block';
            }
        }
        
        // Cerrar modal con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('videoModal');
                if (modal.classList.contains('active')) {
                    closeVideoModal();
                }
            }
        });
        
        // Cerrar modal haciendo clic fuera
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVideoModal();
            }
        });
        
        // Inicializar
        if (checkSession()) {
            loadData();
        }
    </script>
</body>
</html>
